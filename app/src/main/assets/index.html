<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17313a">
<title>Полевая карта — офлайн майндмэп</title>
<style>
:root{
  --ink:#17313a; --ink2:#51676f; --paper:#f3f1ea; --amber:#f5b31a;
  --green:#12a15f; --red:#dd4b39; --blue:#3385d6; --teal:#0d7f8c;
  --body:Verdana,Geneva,'DejaVu Sans',sans-serif; --mono:'Courier New',Courier,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);overflow:hidden;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text;font-family:var(--body)}
button{font-family:var(--body);border:0;background:none;color:inherit;padding:0}
:focus-visible{outline:2px dashed var(--blue);outline-offset:2px}
.hidden{display:none!important}
body.searching #bottombar,body.searching #selbar,body.searching #rail,body.searching #minimap{display:none}

#topbar{position:fixed;z-index:60;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;
  padding:calc(6px + env(safe-area-inset-top)) 10px 8px;background:var(--ink);color:#f3f1ea;box-shadow:0 2px 10px rgba(23,49,58,.35)}
#topbar .logo{font-family:var(--mono);font-weight:bold;font-size:13px;letter-spacing:.1em;display:flex;gap:8px;align-items:center;white-space:nowrap}
#topbar .logo i{width:10px;height:10px;background:var(--amber);display:inline-block;transform:rotate(45deg);flex:none}
#searchWrap{flex:1;max-width:430px;margin-left:auto;position:relative;display:flex;align-items:center}
#search{width:100%;background:#24434e;border:1.5px solid #33555f;border-radius:999px;color:#eef2ee;font-size:13.5px;padding:7px 30px 7px 12px}
#search::placeholder{color:#8ea3aa}
#searchClear{position:absolute;right:4px;color:#9fb3ba;font-size:15px;padding:2px 8px}
#saveDot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
#saveDot.busy{background:var(--amber)}

#board{position:fixed;inset:0;touch-action:none;overflow:hidden;cursor:grab;
  background-color:var(--paper);
  background-image:radial-gradient(circle,#c9c3b1 1.2px,transparent 1.4px),
    radial-gradient(1200px 800px at 20% 10%,rgba(159,214,255,.14),transparent 60%),
    radial-gradient(1000px 700px at 90% 90%,rgba(245,179,26,.12),transparent 60%);
  background-size:64px 64px,auto,auto}
#board.grabbing{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:10px;height:10px;overflow:visible;z-index:1}
#edges path{fill:none;stroke-linecap:round;transition:opacity .2s}
#edges path.dim{opacity:.15}
#boardHint{position:fixed;z-index:1;left:14px;bottom:calc(70px + env(safe-area-inset-bottom));
  font-family:var(--mono);font-size:11px;color:#7d8b85;pointer-events:none;transition:opacity .8s}

/* ===== узел ===== */
.node{position:absolute;width:226px;background:#fff;border:1.5px solid var(--ink);border-radius:10px;
  box-shadow:3px 4px 0 rgba(23,49,58,.16);cursor:grab;z-index:5;display:flex;touch-action:none}
.node.off{display:none}
.node .n-accent{width:8px;flex:none;border-radius:8px 0 0 8px;background:var(--nc,#ffd94d)}
.node .n-body{flex:1;min-width:0;padding:8px 10px 9px}
.node .n-title{font-size:13.5px;font-weight:bold;line-height:1.3;word-break:break-word}
.n-status{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.07em;color:#fff;
  border-radius:3px;padding:2px 5px;margin-right:6px;vertical-align:1px;cursor:pointer}
.n-notes{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.4;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.n-foot{display:flex;gap:7px;margin-top:6px;align-items:center;font-family:var(--mono);font-size:10px;color:#8d8672}
.n-att-thumb img{width:24px;height:24px;object-fit:cover;border-radius:5px;border:1px solid #d9d3c2;display:block}
.n-tgl{position:absolute;right:-13px;top:50%;transform:translateY(-50%);min-width:23px;height:23px;padding:0 4px;
  border-radius:12px;background:#fff;border:1.5px solid var(--ink);font-family:var(--mono);font-size:10.5px;
  display:flex;align-items:center;justify-content:center;z-index:6;box-shadow:1px 2px 0 rgba(23,49,58,.2)}

/* формы */
.node.shape-circle{width:132px;aspect-ratio:1;border-radius:50%;overflow:hidden}
.node.shape-ellipse{width:206px;border-radius:50%}
.node.shape-circle,.node.shape-ellipse{background:linear-gradient(180deg,color-mix(in srgb,var(--nc) 22%,#fff),#fff)}
.node.shape-circle .n-accent,.node.shape-ellipse .n-accent{display:none}
.node.shape-circle .n-notes,.node.shape-ellipse .n-notes{display:none}
.node.shape-circle .n-body,.node.shape-ellipse .n-body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.node.shape-circle .n-body{padding:12px 12px}
.node.shape-ellipse .n-body{padding:22px 32px}
.node.shape-circle .n-top,.node.shape-ellipse .n-top{display:flex;flex-direction:column;align-items:center;gap:3px}
.node.shape-circle .n-title{font-size:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node.shape-circle .n-foot,.node.shape-ellipse .n-foot{justify-content:center;margin-top:4px}

.node.sel{box-shadow:0 0 0 3px var(--blue),3px 4px 0 rgba(23,49,58,.16)}
.node.droptarget{box-shadow:0 0 0 3px var(--teal),3px 4px 0 rgba(23,49,58,.16)}
.node.dragging{z-index:999;transform:rotate(1.5deg);box-shadow:8px 11px 0 rgba(23,49,58,.22);cursor:grabbing}
.node.pulse{animation:pulse .8s ease}
@keyframes pulse{0%{box-shadow:0 0 0 3px var(--blue)}50%{box-shadow:0 0 0 9px rgba(51,133,214,.25)}100%{box-shadow:0 0 0 3px var(--blue)}}
.node.dim{opacity:.2}

.node.root{width:258px;background:var(--ink);color:#f3f1ea;z-index:4}
.node.root .n-accent{background:var(--amber)}
.node.root .n-title{font-size:15.5px}
.node.root .n-notes{color:#b9c6ca}
.node.root .n-foot{color:#93a7ad}
.node.root .n-tgl{background:var(--amber);color:var(--ink)}
.node.root.shape-circle{width:170px}

#rail{position:fixed;z-index:55;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
#rail button{width:42px;height:42px;background:#fff;border:1.5px solid var(--ink);border-radius:10px;
  box-shadow:2px 3px 0 rgba(23,49,58,.18);font-family:var(--mono);font-size:15px;display:flex;align-items:center;justify-content:center}
#rail button:active{transform:translateY(1px)}
#rail #zoomLbl{font-size:10px;text-align:center;font-family:var(--mono);color:var(--ink2)}

#bottombar{position:fixed;z-index:58;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 75%,transparent)}
#bottombar .grow{flex:1}
.fab{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--mono);font-size:10px;color:var(--ink2)}
.fab span:first-child{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--ink);background:#fff;box-shadow:2px 3px 0 rgba(23,49,58,.2);font-size:20px;transition:.12s}
.fab:active span:first-child{transform:translateY(2px)}
.fab.primary span:first-child{background:var(--amber);font-size:26px;width:54px;height:54px}
#fabMenu span:first-child{font-size:17px}
#selbar{position:fixed;z-index:59;left:50%;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;
  bottom:calc(74px + env(safe-area-inset-bottom));display:flex;gap:1px;background:var(--ink);border-radius:14px;
  padding:6px;box-shadow:0 8px 20px rgba(23,49,58,.4);transition:.18s;max-width:96vw;overflow-x:auto}
#selbar.show{transform:translateX(-50%);opacity:1;pointer-events:auto}
.sb{display:flex;flex-direction:column;align-items:center;gap:2px;color:#e8ecea;font-family:var(--mono);
  font-size:8px;letter-spacing:.03em;min-width:42px;padding:5px 2px;border-radius:9px}
.sb b{font-size:17px;font-weight:normal;line-height:1.1}
.sb:active{background:rgba(255,255,255,.15)}
.sb .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#8ea3aa;margin:4px 0 3px}
.sb.danger{color:#ff9d90}

#minimap{position:fixed;z-index:56;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));
  width:150px;height:100px;background:#fff;border:1.5px solid var(--ink);border-radius:8px;
  box-shadow:3px 4px 0 rgba(23,49,58,.2);overflow:hidden;touch-action:none}
#minimap span{position:absolute;border-radius:2px}
#minimap .mm-vp{border:2px solid var(--red);border-radius:3px;background:rgba(221,75,57,.06)}

.overlay{position:fixed;inset:0;z-index:80;background:rgba(23,49,58,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(620px,100%);max-height:90dvh;background:#fdfcf8;border:1.5px solid var(--ink);border-bottom:0;
  border-radius:16px 16px 0 0;display:flex;flex-direction:column;transform:translateY(18px);opacity:0;transition:.18s;
  padding-bottom:env(safe-area-inset-bottom)}
.overlay.show .sheet{transform:none;opacity:1}
.sh-hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1.5px dashed #d9d3c2}
.sh-hd b{flex:1;font-size:15px}
.sh-close{font-size:22px;width:34px;height:34px;border-radius:8px;color:var(--ink2)}
.sh-bd{overflow-y:auto;padding:14px 16px;overscroll-behavior:contain}
.fld{margin-bottom:13px}
.fld label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink2);margin-bottom:5px}
.fld input[type=text],.fld textarea{width:100%;border:1.5px solid #cfc9b8;border-radius:8px;background:#fff;
  font-size:14px;padding:9px 10px;color:var(--ink)}
.fld textarea{min-height:84px;resize:vertical;line-height:1.45}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:8px;border:2px solid rgba(23,49,58,.25);transition:.1s}
.sw.sel{border-color:var(--ink);transform:scale(1.12);box-shadow:2px 2px 0 rgba(23,49,58,.25)}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg button{border:1.5px solid #cfc9b8;border-radius:999px;padding:8px 13px;font-size:12.5px;background:#fff;color:var(--ink2)}
.seg button.sel{border-color:var(--ink);color:var(--ink);font-weight:bold;background:#fff8e6;box-shadow:2px 2px 0 rgba(23,49,58,.2)}
.ck-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ck-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);flex:none}
.ck-row input[type=text]{flex:1;border:0;border-bottom:1.5px dashed #cfc9b8;background:transparent;font-size:13.5px;padding:4px 2px}
.ck-row input.done{text-decoration:line-through;color:var(--ink2)}
.ck-x{color:#b3a98f;font-size:17px;padding:0 4px}
.ck-add{font-family:var(--mono);font-size:12px;color:var(--teal);border:1.5px dashed var(--teal);border-radius:8px;padding:7px 12px;margin-top:4px}
.att-grid{display:flex;flex-wrap:wrap;gap:9px}
.att{position:relative;width:76px;border:1.5px solid #ddd7c6;border-radius:8px;background:#fff;overflow:hidden}
.att .ph{height:64px;display:flex;align-items:center;justify-content:center;background:#f1efe7}
.att img,.att video{width:100%;height:64px;object-fit:cover}
.att .nm{font-family:var(--mono);font-size:9px;padding:4px 5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .att-x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(23,49,58,.8);color:#fff;font-size:13px;line-height:1}
.att .att-vt{position:absolute;top:40px;right:4px;font-family:var(--mono);font-size:9px;background:rgba(23,49,58,.85);color:#fff;padding:1px 4px;border-radius:3px}
#addMediaBtn{width:76px;height:88px;border:2px dashed #b6b09e;border-radius:8px;color:#8d8672;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--mono);font-size:10px}
#addMediaBtn b{font-size:24px;line-height:1}
.btn{border:1.5px solid var(--ink);border-radius:9px;background:#fff;font-size:13.5px;font-weight:bold;
  padding:11px 16px;box-shadow:2px 3px 0 rgba(23,49,58,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(23,49,58,.18)}
.btn.amber{background:var(--amber)}
.btn.danger{color:var(--red);border-color:var(--red);box-shadow:2px 3px 0 rgba(221,75,57,.25)}
.btn.ghost{border-style:dashed;font-weight:normal;color:var(--ink2);box-shadow:none}
.sh-ft{display:flex;gap:10px;align-items:center;padding:12px 16px;border-top:1.5px dashed #d9d3c2}
.meta-line{font-family:var(--mono);font-size:11px;color:#8d8672;margin:0 0 12px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-size:14px;padding:13px 6px;border-bottom:1.5px dashed #e7e2d3}
.menu-item:last-child{border:0}
.menu-item .mi-ic{width:30px;height:30px;flex:none;border:1.5px solid var(--ink);border-radius:8px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px}
.menu-item.danger{color:var(--red)}
.menu-item.danger .mi-ic{border-color:var(--red)}

#viewer{position:fixed;inset:0;z-index:95;background:rgba(14,29,35,.96);display:flex;flex-direction:column}
#vwTop{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;color:#e8ecea}
#vwName{flex:1;font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vwTop button{color:#e8ecea;font-size:19px;width:38px;height:38px;border-radius:8px;border:1.5px solid rgba(255,255,255,.25)}
#vwStage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0}
#vwStage img,#vwStage video{max-width:100%;max-height:100%;border:3px solid #fff;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

#toast{position:fixed;z-index:120;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#f3f1ea;font-size:13px;padding:11px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;
  opacity:0;pointer-events:none;transition:.2s;max-width:92vw;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{color:var(--amber);font-family:var(--mono);font-size:12px;font-weight:bold;letter-spacing:.06em}
@media (max-width:560px){ #boardHint{display:none} }
</style>
</head>
<body>

<header id="topbar">
  <span class="logo"><i></i>ПОЛЕВАЯ КАРТА</span>
  <div id="searchWrap">
    <input id="search" type="search" placeholder="Поиск по узлам…" autocomplete="off">
    <button id="searchClear" class="hidden">✕</button>
  </div>
  <span id="saveDot" title="Автосохранение"></span>
</header>

<div id="board">
  <div id="world"><svg id="edges" aria-hidden="true"></svg></div>
</div>
<div id="boardHint">тяните фон — панорама · узлы двигаются свободно · двойной тап — новый узел</div>

<div id="rail">
  <button id="zoomIn">+</button>
  <div id="zoomLbl">100%</div>
  <button id="zoomOut">−</button>
  <button id="homeBtn" title="К корню">⌂</button>
  <button id="fitBtn" title="Разложить лучами (солнышком)">✳</button>
</div>

<div id="minimap" class="hidden"></div>

<div id="selbar">
  <button class="sb" id="sbAdd"><b>＋</b>ветка</button>
  <button class="sb" id="sbEdit"><b>✎</b>текст</button>
  <button class="sb" id="sbAtt"><b>📎</b>файлы</button>
  <button class="sb" id="sbStatus"><span class="dot"></span>статус</button>
  <button class="sb" id="sbShape"><b>□</b>форма</button>
  <button class="sb" id="sbTgl"><b>⌄</b>свернуть</button>
  <button class="sb danger" id="sbDel"><b>✕</b>удалить</button>
</div>

<nav id="bottombar">
  <button class="fab primary" id="fabTopic"><span>＋</span><span>узел</span></button>
  <span class="grow"></span>
  <button class="fab" id="fabMenu"><span>☰</span><span>меню</span></button>
</nav>

<div id="menuOverlay" class="overlay hidden"><div class="sheet">
  <div class="sh-hd"><b>Меню</b><button class="sh-close" data-close>✕</button></div>
  <div class="sh-bd">
    <div class="meta-line" id="statLine">…</div>
    <button class="menu-item" id="miExport"><span class="mi-ic">⤓</span>Экспорт резервной копии (.json)</button>
    <button class="menu-item" id="miImport"><span class="mi-ic">⤒</span>Импорт из резервной копии</button>
    <button class="menu-item" id="miFit"><span class="mi-ic">✳</span>Разложить лучами (солнышком)</button>
    <button class="menu-item" id="miShowAll"><span class="mi-ic">▤</span>Показать всю карту</button>
    <button class="menu-item" id="miSettings"><span class="mi-ic">⚙</span>Настройки</button>
    <button class="menu-item danger" id="miWipe"><span class="mi-ic">☒</span>Стереть все данные</button>
  </div>
</div></div>

<div id="setOverlay" class="overlay hidden"><div class="sheet">
  <div class="sh-hd"><b>Настройки</b><button class="sh-close" data-close>✕</button></div>
  <div class="sh-bd">
    <div class="fld"><label>МИНИКАРТА</label><button class="btn ghost" id="setMinimap" style="width:100%"></button></div>
    <div class="fld"><label>ХРАНИЛИЩЕ</label><div class="meta-line" id="setStorage" style="margin:0">…</div></div>
    <div class="meta-line" style="margin:0">узлы двигаются свободно и запоминают место · связи цепляются к ближайшей стороне фигуры · ✳ раскладывает ветки лучами</div>
  </div>
</div></div>

<div id="qaSheet" class="overlay hidden"><div class="sheet">
  <div class="sh-hd"><b id="qaCap">Новый узел</b><button class="sh-close" data-close>✕</button></div>
  <div class="sh-bd">
    <div class="fld"><textarea id="qaText" placeholder="Заголовок; со второй строки — заметки…"></textarea></div>
    <div class="fld"><label>ФОРМА</label><div class="seg" id="qaShapes"></div></div>
    <div class="fld"><label>ЦВЕТ</label><div class="swatches" id="qaColors"></div></div>
  </div>
  <div class="sh-ft"><button class="btn amber" id="qaAdd" style="flex:1">Добавить</button></div>
</div></div>

<div id="edOverlay" class="overlay hidden"><div class="sheet">
  <div class="sh-hd"><b id="edCap">Узел</b><button class="sh-close" data-close>✕</button></div>
  <div class="sh-bd">
    <div class="fld"><label>ЗАГОЛОВОК</label><input type="text" id="edTitle" placeholder="Название…"></div>
    <div class="fld"><label>ЗАМЕТКИ / РЕЗУЛЬТАТЫ</label><textarea id="edDesc" placeholder="Наблюдения, цифры, выводы…"></textarea></div>
    <div class="fld"><label>ФОРМА</label><div class="seg" id="edShapes"></div></div>
    <div class="fld"><label>СТАТУС</label><div class="seg" id="edStatus"></div></div>
    <div class="fld"><label>ЦВЕТ</label><div class="swatches" id="edColors"></div></div>
    <div class="fld"><label>ЧЕКЛИСТ</label><div id="edChecks"></div><button class="ck-add" id="ckAdd">+ пункт</button></div>
    <div class="fld"><label>ВЛОЖЕНИЯ · ФОТО · ВИДЕО · ФАЙЛЫ</label>
      <div class="att-grid" id="edMedia"></div>
      <div class="meta-line" id="quotaLine" style="margin-top:8px"></div></div>
    <div class="meta-line" id="edMeta"></div>
  </div>
  <div class="sh-ft">
    <button class="btn danger" id="edDelete">Удалить</button>
    <button class="btn ghost" id="edUp" title="Выше среди соседних">↑</button>
    <button class="btn ghost" id="edDown" title="Ниже среди соседних">↓</button>
    <span style="flex:1"></span>
    <button class="btn amber" id="edSave">Готово</button>
  </div>
</div></div>

<div id="viewer" class="hidden">
  <div id="vwTop">
    <span id="vwName"></span>
    <button id="vwDl" title="Скачать">⤓</button>
    <button id="vwClose">✕</button>
  </div>
  <div id="vwStage"></div>
</div>

<div id="toast"><span id="toastMsg"></span><button id="toastAct" class="hidden"></button></div>

<input type="file" id="fileImport" accept="application/json,.json" hidden>
<input type="file" id="mediaInput" multiple hidden>
<input type="file" id="mediaCam" accept="image/*" capture="environment" hidden>

<script>
(()=>{'use strict';
/* ===== утилиты ===== */
const $=s=>document.querySelector(s);
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const debounce=(fn,t)=>{let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>fn(...a),t)}};
const fmtBytes=b=>{if(!b&&b!==0)return'';const u=['Б','КБ','МБ','ГБ'];let i=0;while(b>=1024&&i<3){b/=1024;i++}return b.toFixed(b<10&&i>0?1:0)+' '+u[i]};
const fmtDate=ts=>new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const fmtDur=s=>{if(!isFinite(s))return'';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const blobToURL=b=>URL.createObjectURL(b);

const PALETTE=['#ffd94d','#ffb27a','#9fe3b4','#9fd6ff','#d9c6ff','#ffffff'];
const STATUS={work:{l:'В РАБОТЕ',c:'#3385d6'},done:{l:'ВЫПОЛНЕНО',c:'#12a15f'},report:{l:'ОТЧЁТ',c:'#e08e0b'}};
const STATUS_ORDER=[null,'work','done','report'];
const SHAPES=[['rect','Прямоугольник'],['circle','Круг'],['ellipse','Эллипс']];
const SHAPE_GLYPH={rect:'□',circle:'○',ellipse:'⬭'};
const DB_NAME='field-map',DB_VER=1,DATA_VER=2;

/* ===== состояние ===== */
let db;
const state={rootId:null,nodes:[],attachments:[],view:{x:0,y:0,z:1},settings:{minimap:false}};
let selected=null,editing=null,editorAtts=[],lastVis=new Set(),pending=null,searchQ='';
let qaTarget=null,qaPos=null,qaColor=PALETTE[0],qaShape='rect',mediaTarget=null;
const nodeEl=new Map(),thumbCache=new Map();
const boardEl=$('#board'),world=$('#world'),svg=$('#edges');
const root=()=>state.nodes.find(n=>n.id===state.rootId);
const kidsOf=pid=>state.nodes.filter(n=>n.parentId===pid);
const nodeById=id=>state.nodes.find(n=>n.id===id);
function descendants(id){const s=new Set(),q=[id];while(q.length){const c=q.shift();
  state.nodes.forEach(n=>{if(n.parentId===c&&!s.has(n.id)){s.add(n.id);q.push(n.id)}})}return s}

/* ===== IndexedDB ===== */
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=()=>{const d=r.result;
    if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');
    if(!d.objectStoreNames.contains('att'))d.createObjectStore('att',{keyPath:'id'});};
  r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
const kvGet=k=>new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const kvSet=(k,v)=>new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
const attPut=a=>new Promise((res,rej)=>{const tx=db.transaction('att','readwrite');tx.objectStore('att').put(a);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
const attGet=id=>new Promise((res,rej)=>{const q=db.transaction('att').objectStore('att').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const attDel=id=>new Promise(res=>{const tx=db.transaction('att','readwrite');tx.objectStore('att').delete(id);tx.oncomplete=res});

const saveBoard=()=>kvSet('board',{v:DATA_VER,rootId:state.rootId,nodes:state.nodes,view:state.view,settings:state.settings});
const queueSave=(()=>{const dot=$('#saveDot');const go=debounce(async()=>{dot.classList.add('busy');
  try{await saveBoard()}catch(e){toast('Ошибка сохранения: '+e.message)}dot.classList.remove('busy')},350);
  return()=>{dot.classList.add('busy');go()}})();

async function loadOrSeed(){
  const d=await kvGet('board');
  if(d&&d.nodes){state.rootId=d.rootId;state.nodes=d.nodes;
    state.view=Object.assign({x:40,y:80,z:1},d.view);
    state.settings=Object.assign({minimap:false},d.settings);
    state.attachments=await kvGet('attachments')||[];return false}
  seed();return true;
}
function seed(){
  const now=Date.now();
  const mk=(parentId,title,extra={})=>{const n={id:uid(),parentId,title,notes:'',status:null,shape:'rect',
    color:PALETTE[(state.nodes.length)%5],checklist:[],collapsed:false,createdAt:now,updatedAt:now,...extra};
    state.nodes.push(n);return n};
  const r=mk(null,'Рабочие дела',{color:'#ffd94d'});state.rootId=r.id;
  const res=mk(r.id,'Исследования материалов',{color:'#9fd6ff',shape:'ellipse'});
  mk(res.id,'Материал А · прочность',{status:'work',color:'#9fd6ff',
    notes:'Нагрузка 40 кг, серия из 5 прогонов.\nРезультаты заносить сюда.',
    checklist:[{t:'Подготовить образцы',d:true},{t:'Прогнать на стенде',d:false},{t:'Записать цифры',d:false}]});
  mk(res.id,'Материал Б · термостойкость',{status:'done',color:'#9fe3b4',shape:'circle',notes:'180 °C выдержал, деформаций нет.'});
  mk(res.id,'Материал В · влагостойкость',{color:'#ffffff',notes:'План: распыление 48 ч, затем замер массы.'});
  const tasks=mk(r.id,'Задачи',{color:'#ffb27a'});
  mk(tasks.id,'Согласовать бюджет',{status:'work',color:'#ffb27a'});
  mk(tasks.id,'Заказать партию образцов',{status:'done',color:'#9fe3b4'});
  const rep=mk(r.id,'Отчёты',{color:'#ffd94d',shape:'ellipse'});
  mk(rep.id,'Сводка за неделю',{status:'report',color:'#ffd94d',notes:'Приложить фото стенда и таблицу результатов.'});
}

/* ===== рендер узлов ===== */
function makeNodeEl(n){
  const el=document.createElement('div');
  el.className='node'+(n.id===state.rootId?' root':'');el.dataset.id=n.id;
  el.innerHTML=`<div class="n-accent"></div><div class="n-body">
    <div class="n-top"><span class="n-status"></span><span class="n-title"></span></div>
    <div class="n-notes"></div><div class="n-foot"></div></div>
    <button class="n-tgl"></button>`;
  world.appendChild(el);nodeEl.set(n.id,el);bindNode(el,n);applyNode(n);
  if(n.x!==undefined&&n.x!==null){el.style.left=n.x+'px';el.style.top=n.y+'px'}
  return el;
}
function applyNode(n){
  const el=nodeEl.get(n.id);if(!el)return;
  el.style.setProperty('--nc',n.color||'#ffd94d');
  el.querySelector('.n-accent').style.background=n.color||'#ffd94d';
  el.querySelector('.n-title').textContent=n.title||'без названия';
  const notes=el.querySelector('.n-notes');notes.textContent=n.notes||'';notes.classList.toggle('hidden',!n.notes);
  const st=el.querySelector('.n-status');
  if(n.status&&STATUS[n.status]){st.textContent=STATUS[n.status].l;st.style.background=STATUS[n.status].c;st.style.display='inline-block'}
  else st.style.display='none';
  const atts=state.attachments.filter(a=>a.nodeId===n.id);
  const ck=n.checklist||[],done=ck.filter(x=>x.d).length;
  let foot='';
  if(atts.length)foot+=`<span class="n-att-thumb"></span><span>📎${atts.length}</span>`;
  if(ck.length)foot+=`<span>✓${done}/${ck.length}</span>`;
  const f=el.querySelector('.n-foot');f.innerHTML=foot;f.classList.toggle('hidden',!foot);
  if(atts.length){const img=atts.find(a=>a.type==='image');
    if(img){const slot=f.querySelector('.n-att-thumb');const im=document.createElement('img');slot.appendChild(im);
      thumbURL(img.id).then(u=>{if(u&&im.isConnected)im.src=u})}}
  const kids=kidsOf(n.id).length,tgl=el.querySelector('.n-tgl');
  el.classList.toggle('collapsed',!!n.collapsed);
  if(kids){tgl.classList.remove('hidden');tgl.textContent=n.collapsed?'+'+descendants(n.id).size:'−'}
  else tgl.classList.add('hidden');
  el.classList.toggle('shape-circle',(n.shape||'rect')==='circle');
  el.classList.toggle('shape-ellipse',n.shape==='ellipse');
  el.classList.toggle('sel',selected===n.id);
  el.classList.toggle('dim',!!(searchQ&&!matchNode(n)));
}
const matchNode=n=>(n.title+' '+(n.notes||'')).toLowerCase().includes(searchQ);

/* ===== свободная раскладка ===== */
function visibleSet(){const s=new Set();const w=n=>{s.add(n.id);if(!n.collapsed)kidsOf(n.id).forEach(w)};
  const r=root();if(r)w(r);
  state.nodes.forEach(n=>{if(n.parentId===null&&!s.has(n.id))w(n)}); // свободные узлы без родителя
  return s}
function measureVisible(){lastVis.forEach(id=>{const n=nodeById(id),el=nodeEl.get(id);
  if(n&&el){n._w=el.offsetWidth;n._h=el.offsetHeight}})}
function refresh(){
  lastVis=visibleSet();
  state.nodes.forEach(n=>{const el=nodeEl.get(n.id);if(el)el.classList.toggle('off',!lastVis.has(n.id))});
  measureVisible();
  state.nodes.forEach(n=>{const el=nodeEl.get(n.id);if(el&&n.x!==undefined){el.style.left=n.x+'px';el.style.top=n.y+'px'}});
  drawEdges();updateMinimap();
}
function anchor(n,tx,ty){
  const cx=n.x+n._w/2, cy=n.y+n._h/2;
  let dx=tx-cx, dy=ty-cy;
  if(!dx&&!dy)return{x:cx,y:cy};
  const hw=n._w/2, hh=n._h/2;
  if((n.shape||'rect')==='rect'){
    const s=1/Math.max(Math.abs(dx)/hw,Math.abs(dy)/hh);
    return{x:cx+dx*s,y:cy+dy*s};
  }
  const t=1/Math.sqrt((dx/hw)**2+(dy/hh)**2);
  return{x:cx+dx*t,y:cy+dy*t};
}
function drawEdges(){
  svg.innerHTML='';
  state.nodes.forEach(n=>{
    if(!n.parentId||!lastVis.has(n.id))return;
    const p=nodeById(n.parentId);
    if(!p||!lastVis.has(p.id))return;
    const pc={x:p.x+p._w/2,y:p.y+p._h/2}, nc={x:n.x+n._w/2,y:n.y+n._h/2};
    const A=anchor(p,nc.x,nc.y), B=anchor(n,pc.x,pc.y);
    const dx=B.x-A.x, dy=B.y-A.y, dist=Math.hypot(dx,dy)||1, ux=dx/dist, uy=dy/dist;
    const k=Math.min(70,dist*0.33);
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M ${A.x} ${A.y} C ${A.x+ux*k} ${A.y+uy*k}, ${B.x-ux*k} ${B.y-uy*k}, ${B.x} ${B.y}`);
    path.setAttribute('stroke',`color-mix(in srgb, ${n.color||'#9aa8a3'} 65%, #17313a)`);
    path.setAttribute('stroke-width',p.id===state.rootId?3:2.2);
    if(searchQ&&!matchNode(n))path.classList.add('dim');
    svg.appendChild(path);
  });
}
/* автораскладка «солнышком» */
function tidyRadial(){
  const R=185;
  lastVis=visibleSet();
  state.nodes.forEach(n=>{const el=nodeEl.get(n.id);if(el)el.classList.toggle('off',!lastVis.has(n.id))});
  measureVisible();
  const roots=state.nodes.filter(n=>n.parentId===null);
  const leafCount=n=>{const ch=n.collapsed?[]:kidsOf(n.id);return ch.length?ch.reduce((s,c)=>s+leafCount(c),0):1};
  const depthOf=n=>{const ch=n.collapsed?[]:kidsOf(n.id);return ch.length?1+Math.max(...ch.map(depthOf)):0};
  let ox=100;
  roots.forEach(r=>{
    const rad=depthOf(r)*R+Math.max(r._w||250,r._h||80)+80;
    const cx=ox+rad, cy=rad+100;
    r.x=cx-(r._w||250)/2; r.y=cy-(r._h||80)/2;
    const walk=(n,a0,a1)=>{
      const ch=n.collapsed?[]:kidsOf(n.id); if(!ch.length)return;
      const tot=ch.reduce((s,c)=>s+leafCount(c),0);
      let a=a0;
      const px=n.x+(n._w||0)/2, py=n.y+(n._h||0)/2;
      ch.forEach(c=>{
        const span=(a1-a0)*leafCount(c)/tot;
        const mid=a+span/2;
        c.x=px+Math.cos(mid)*R-(c._w||226)/2;
        c.y=py+Math.sin(mid)*R-(c._h||60)/2;
        walk(c,a,a+span);
        a+=span;
      });
    };
    walk(r,-Math.PI/2,Math.PI*1.5);
    ox+=rad*2+140;
  });
  refresh();fitView();queueSave();
}
function childPos(p){
  const k=kidsOf(p.id).length;
  const ang=(-90+k*137.5)*Math.PI/180;
  const r=Math.max(p._w||200,p._h||60)/2+155;
  return{x:p.x+(p._w||200)/2+Math.cos(ang)*r-113, y:p.y+(p._h||60)/2+Math.sin(ang)*r-40};
}
function floatingCenter(){const w=toWorld(innerWidth/2,innerHeight/2);return{x:w.x-113,y:w.y-40}}

/* ===== холст ===== */
function applyView(){
  world.style.transform=`translate(${state.view.x}px,${state.view.y}px) scale(${state.view.z})`;
  boardEl.style.backgroundPosition=`${state.view.x}px ${state.view.y}px,0 0,0 0`;
  boardEl.style.backgroundSize=`${64*state.view.z}px ${64*state.view.z}px,auto,auto`;
  $('#zoomLbl').textContent=Math.round(state.view.z*100)+'%';
  updateMinimap();
}
function toWorld(cx,cy){const r=boardEl.getBoundingClientRect();
  return{x:(cx-r.left-state.view.x)/state.view.z,y:(cy-r.top-state.view.y)/state.view.z}}
function zoomAt(cx,cy,f){
  const r=boardEl.getBoundingClientRect(),px=cx-r.left,py=cy-r.top;
  const z0=state.view.z,z1=Math.min(2.5,Math.max(.3,z0*f));if(z1===z0)return;
  state.view.x=px-(px-state.view.x)*(z1/z0);state.view.y=py-(py-state.view.y)*(z1/z0);
  state.view.z=z1;applyView();queueSave();
}
const ptrs=new Map();let pinch0=null,panS=null,spaceDown=false;
boardEl.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button===1)e.preventDefault();
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];
    pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,view:{...state.view}};
    panS=null;boardEl.classList.add('grabbing');
  }else if(ptrs.size===1&&(e.target===boardEl||e.target===world||e.target===svg||spaceDown)){
    panS={sx:e.clientX,sy:e.clientY,vx:state.view.x,vy:state.view.y,moved:false};
    boardEl.classList.add('grabbing');e.preventDefault();
  }
},{passive:false});
window.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch0&&ptrs.size>=2){
    const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const r=boardEl.getBoundingClientRect();
    const z=Math.min(2.5,Math.max(.3,pinch0.view.z*(d/(pinch0.d||1))));
    const wx=(pinch0.mx-r.left-pinch0.view.x)/pinch0.view.z,wy=(pinch0.my-r.top-pinch0.view.y)/pinch0.view.z;
    state.view.z=z;state.view.x=(mx-r.left)-wx*z;state.view.y=(my-r.top)-wy*z;applyView();
  }else if(panS&&ptrs.size===1){
    const dx=e.clientX-panS.sx,dy=e.clientY-panS.sy;
    if(!panS.moved&&Math.hypot(dx,dy)>6){panS.moved=true;$('#boardHint').style.opacity=0}
    if(panS.moved){state.view.x=panS.vx+dx;state.view.y=panS.vy+dy;applyView()}
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(ptrs.size<2){pinch0=null;
    if(ptrs.size===1){const[p]=[...ptrs.values()];panS={sx:p.x,sy:p.y,vx:state.view.x,vy:state.view.y,moved:true}}
    else{if(panS&&!panS.moved){queueSave();if(e.target===boardEl||e.target===world||e.target===svg)setSelected(null)}
      panS=null;boardEl.classList.remove('grabbing')}}
}
window.addEventListener('pointerup',endPtr);window.addEventListener('pointercancel',endPtr);
boardEl.addEventListener('wheel',e=>{e.preventDefault();
  if(e.ctrlKey||e.metaKey)zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:0.89);
  else{state.view.x-=e.deltaX;state.view.y-=e.deltaY;applyView();queueSave()}},{passive:false});
boardEl.addEventListener('dblclick',e=>{
  if(e.target!==boardEl&&e.target!==world&&e.target!==svg)return;
  const w=toWorld(e.clientX,e.clientY);
  openQuickAdd(null,{x:w.x-113,y:w.y-40});
});
boardEl.addEventListener('contextmenu',e=>{if(e.target===boardEl||e.target===world)e.preventDefault()});
function tap(el,fn){
  el.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0)return;
    e.stopPropagation();
    const t=Date.now(),sx=e.clientX,sy=e.clientY;let dead=false;
    const mv=ev=>{if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>9)dead=true};
    const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
      if(!dead&&Date.now()-t<500)fn()};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  });
}

/* ===== узлы: свободное перетаскивание ===== */
function bindNode(el,n){
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('.n-tgl'))return;
    if(e.button!==undefined&&e.button!==0)return;
    e.stopPropagation();
    const sx=e.clientX,sy=e.clientY;let st='maybe',raf=false;
    el.setPointerCapture(e.pointerId);
    const w0=toWorld(sx,sy),offX=w0.x-(n.x||0),offY=w0.y-(n.y||0);
    const mv=ev=>{
      if(st==='maybe'&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>9){st='drag';el.classList.add('dragging');buzz(8)}
      if(st==='drag'){
        const w=toWorld(ev.clientX,ev.clientY);
        n.x=w.x-offX;n.y=w.y-offY;
        el.style.left=n.x+'px';el.style.top=n.y+'px';
        if(!raf){raf=true;requestAnimationFrame(()=>{raf=false;drawEdges()})}
      }
    };
    const up=()=>{
      el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
      el.classList.remove('dragging');
      if(st==='drag'){buzz(6);queueSave();updateMinimap()}
      else if(st==='maybe')setSelected(selected===n.id?null:n.id);
    };
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  });
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('dblclick',e=>{e.stopPropagation();openQuickAdd(n.id)});
  const tgl=el.querySelector('.n-tgl');
  tap(tgl,()=>{n.collapsed=!n.collapsed;applyNode(n);refresh();queueSave();buzz(6);updateSelbar()});
  tap(el.querySelector('.n-status'),()=>cycleStatus(n));
  el.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('Files')){e.preventDefault();el.classList.add('droptarget')}});
  el.addEventListener('dragleave',()=>el.classList.remove('droptarget'));
  el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('droptarget');
    if(e.dataTransfer.files.length){addFilesToNode(n,e.dataTransfer.files);setSelected(n.id)}});
}
function cycleStatus(n){
  const i=STATUS_ORDER.indexOf(n.status||null);
  n.status=STATUS_ORDER[(i+1)%STATUS_ORDER.length];n.updatedAt=Date.now();
  applyNode(n);queueSave();buzz(6);updateSelbar();
}
function setShape(n,shape){
  const cx=n.x+(n._w||0)/2, cy=n.y+(n._h||0)/2;
  n.shape=shape;n.updatedAt=Date.now();
  applyNode(n);
  const el=nodeEl.get(n.id);
  n._w=el.offsetWidth;n._h=el.offsetHeight;
  n.x=cx-n._w/2;n.y=cy-n._h/2;
  el.style.left=n.x+'px';el.style.top=n.y+'px';
  drawEdges();updateMinimap();queueSave();updateSelbar();
}

/* ===== выбор и панель действий ===== */
function setSelected(id){
  selected=id;
  state.nodes.forEach(n=>{const el=nodeEl.get(n.id);el&&el.classList.toggle('sel',n.id===id)});
  updateSelbar();
}
function updateSelbar(){
  const bar=$('#selbar'),n=selected?nodeById(selected):null;
  bar.classList.toggle('show',!!n);

function deleteNode(id){
  const n=nodeById(id);if(!n)return;
  if(id===state.rootId){toast('Корень удалить нельзя');return}
  const ids=[...descendants(id),id];
  if(ids.length>1&&!confirm(`Удалить ветку из ${ids.length} узлов?`))return;
  const snap=JSON.parse(JSON.stringify(state.nodes));
  const snapAtt=state.attachments.slice();
  const goneAtts=state.attachments.filter(a=>ids.includes(a.nodeId)).map(a=>a.id);
  state.nodes=state.nodes.filter(x=>!ids.includes(x.id));
  state.attachments=state.attachments.filter(a=>!ids.includes(a.nodeId));
  ids.forEach(i=>{const el=nodeEl.get(i);el&&el.remove();nodeEl.delete(i)});
  if(selected&&ids.includes(selected))selected=null;
  updateSelbar();refresh();queueSave();
  lastUndo={snap,snapAtt};pending=goneAtts;
  clearTimeout(pendingTO);pendingTO=setTimeout(()=>{
    if(pending){pending.forEach(attDel);pending=null}},6000);
  toast(`Удалено узлов: ${ids.length}`,'Отменить');
}

function doUndo(){
  if(!lastUndo)return;
  pending=null;clearTimeout(pendingTO);
  state.nodes=lastUndo.snap;state.attachments=lastUndo.snapAtt;

/* ===== вложения ===== */
function downscaleImage(file){
  return new Promise(res=>{
    if(!file.type.startsWith('image/')||file.size<400*1024){res(file);return}
    const url=blobToURL(file),im=new Image();
    im.onload=()=>{const M=1600;let{width:w,height:h}=im;
      if(Math.max(w,h)>M){const k=M/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(im,0,0,w,h);
      cv.toBlob(b=>{res(b&&b.size<file.size?new File([b],(file.name||'фото').replace(/\.\w+$/,''),{type:'image/jpeg'}):file)},'image/jpeg',0.82);
      URL.revokeObjectURL(url)};
    im.onerror=()=>res(file);im.src=url});
}
function probeVideo(blob){
  return new Promise(res=>{
    const u=blobToURL(blob),v=document.createElement('video');v.muted=true;v.src=u;
    const to=setTimeout(()=>{URL.revokeObjectURL(u);res({})},4000);
    v.onloadeddata=()=>{v.currentTime=Math.min(0.4,(v.duration||1)/3)};
    v.onseeked=()=>{const cv=document.createElement('canvas');
      cv.width=320;cv.height=Math.max(2,320*v.videoHeight/Math.max(1,v.videoWidth));
      try{cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
        cv.toBlob(b=>{clearTimeout(to);URL.revokeObjectURL(u);res({thumb:b,dur:v.duration})},'image/jpeg',0.7)}
      catch(e){clearTimeout(to);URL.revokeObjectURL(u);res({dur:v.duration})}};
    v.onerror=()=>{clearTimeout(to);URL.revokeObjectURL(u);res({})};
  });
}
async function makeAttachment(nodeId,file){
  let blob=file,type='file';
  if(file.type.startsWith('image/')){type='image';blob=await downscaleImage(file)}
  else if(file.type.startsWith('video/'))type='video';
  const a={id:uid(),nodeId,type,mime:blob.type||'application/octet-stream',size:blob.size,ts:Date.now(),blob,
    name:file.name||((type==='image'?'фото_':type==='video'?'видео_':'файл_')+new Date().toISOString().slice(0,16).replace(/[:T]/g,''))};
  if(type==='video'){const p=await probeVideo(blob);if(p.thumb)a.thumbBlob=p.thumb;if(p.dur)a.dur=Math.round(p.dur)}
  return a;
}
async function addFilesToNode(n,files){
  buzz(10);
  for(const f of files){
    const a=await makeAttachment(n.id,f);
    state.attachments.push(a);
    try{await attPut({id:a.id,nodeId:a.nodeId,name:a.name,type:a.type,mime:a.mime,size:a.size,ts:a.ts,blob:a.blob,
      ...(a.thumbBlob?{thumbBlob:a.thumbBlob}:{}),...(a.dur?{dur:a.dur}:{})})}
    catch(e){toast('Не удалось сохранить файл: '+e.message)}
    if(editing===n.id)editorAtts.push(a);
  }
  refresh();if(editing===n.id){renderEditorMedia();refreshQuota()}
  queueSave();checkQuota();toast(files.length>1?`Прикреплено файлов: ${files.length}`:'Файл прикреплён');
}
const thumbURL=async id=>{
  if(thumbCache.has(id))return thumbCache.get(id);
  const a=await attGet(id);if(!a||!a.blob)return null;
  const u=blobToURL(a.blob);thumbCache.set(id,u);return u;
};
async function refreshQuota(){
  let sz=0;state.attachments.forEach(a=>sz+=a.size||0);
  $('#quotaLine').textContent=`вложений: ${state.attachments.length} · ≈ ${fmtBytes(sz)}`;
  try{if(navigator.storage&&navigator.storage.estimate){
    const{usage,quota}=await navigator.storage.estimate();
    $('#quotaLine').textContent+=` · свободно ${fmtBytes(quota-usage)}`;
    if(navigator.storage.persist&&!navigator.storage.persisted)navigator.storage.persist().catch(()=>{})}}catch(e){}
}
function checkQuota(){try{navigator.storage&&navigator.storage.estimate&&navigator.storage.estimate().then(({usage,quota})=>{

const mm=$('#minimap');
function updateMinimap(){
  if(mm.classList.contains('hidden'))return;
  const W=150,H=100;let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  lastVis.forEach(id=>{const n=nodeById(id);
    minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);
    maxX=Math.max(maxX,n.x+n._w);maxY=Math.max(maxY,n.y+n._h)});
  if(minX>maxX){minX=0;minY=0;maxX=1200;maxY=800}
  minX-=120;minY-=120;maxX+=120;maxY+=120;
  const s=Math.min(W/(maxX-minX),H/(maxY-minY));
  let html='';
  lastVis.forEach(id=>{const n=nodeById(id);
    html+=`<span style="left:${(n.x-minX)*s}px;top:${(n.y-minY)*s}px;width:${Math.max(2,n._w*s)}px;height:${Math.max(2,n._h*s)}px;background:${n.id===state.rootId?'#17313a':(n.color==='#ffffff'?'#cfc9b8':n.color)};border-radius:${(n.shape||'rect')==='rect'?'2px':'50%'}`+'"></span>'});
  html+=`<span class="mm-vp" style="left:${(-state.view.x/state.view.z-minX)*s}px;top:${(-state.view.y/state.view.z-minY)*s}px;width:${innerWidth/state.view.z*s}px;height:${innerHeight/state.view.z*s}px"></span>`;
  mm.innerHTML=html;mm.dataset.s=s;mm.dataset.ox=minX;mm.dataset.oy=minY;
}
function mmJump(e){
  const r=mm.getBoundingClientRect(),s=+mm.dataset.s||.1;
  const wx=+mm.dataset.ox+(e.clientX-r.left)/s,wy=+mm.dataset.oy+(e.clientY-r.top)/s;
  state.view.x=innerWidth/2-wx*state.view.z;state.view.y=innerHeight/2-wy*state.view.z;
  applyView();queueSave();
}
mm.addEventListener('pointerdown',e=>{e.stopPropagation();mmJump(e);
  const mv=ev=>mmJump(ev);const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up)};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)});

$('#fabMenu').onclick=()=>{
  let sz=0;state.attachments.forEach(a=>sz+=a.size||0);
  $('#statLine').textContent=`узлов: ${state.nodes.length} · вложений: ${state.attachments.length} (≈${fmtBytes(sz)})`;
  openOverlay($('#menuOverlay'));
};
$('#menuOverlay').querySelector('[data-close]').onclick=()=>closeOverlay($('#menuOverlay'));
$('#miFit').onclick=()=>{closeOverlay($('#menuOverlay'));tidyRadial();toast('Ветки разложены лучами')};
$('#miShowAll').onclick=()=>{closeOverlay($('#menuOverlay'));fitView()};
$('#miSettings').onclick=()=>{closeOverlay($('#menuOverlay'));renderSettings();openOverlay($('#setOverlay'))};
$('#miExport').onclick=()=>{
  const data={app:'field-map',v:DATA_VER,exportedAt:new Date().toISOString(),
    rootId:state.rootId,nodes:state.nodes,view:state.view,settings:state.settings,attachments:state.attachments};
  const u=blobToURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  const l=document.createElement('a');l.href=u;l.download='mindmap-backup-'+new Date().toISOString().slice(0,10)+'.json';l.click();
  setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Резервная копия сохранена');
};
$('#miImport').onclick=()=>$('#fileImport').click();
$('#fileImport').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  closeOverlay($('#menuOverlay'));
  try{
    const d=JSON.parse(await f.text());
    if(!d.nodes||d.v>DATA_VER)throw new Error('несовместимый файл');
    if(!confirm('Заменить текущую карту данными из копии?'))return;
    state.rootId=d.rootId;state.nodes=d.nodes;state.attachments=d.attachments||[];
    state.view=Object.assign({x:40,y:80,z:1},d.view);state.settings=Object.assign({minimap:false},d.settings);
    for(const a of state.attachments)if(a.blob)await attPut(a);
    await saveBoard();await kvSet('attachments',state.attachments.map(({blob,thumbBlob,...r})=>r));
    rebuildAll();
    if(state.nodes.some(n=>n.x===undefined||n.x===null))tidyRadial();
    applyView();toast('Данные импортированы');
  }catch(err){toast('Не удалось импортировать: '+err.message)}
};
$('#miWipe').onclick=async()=>{
  closeOverlay($('#menuOverlay'));
  if(!confirm('Стереть ВСЮ карту без возможности восстановления?'))return;
  if(!confirm('Точно? Сначала можно сделать экспорт в меню.'))return;
  await new Promise(res=>{const rq=indexedDB.deleteDatabase(DB_NAME);rq.onsuccess=rq.onerror=rq.onblocked=res});
  location.reload();
};
$('#setOverlay').querySelector('[data-close]').onclick=()=>closeOverlay($('#setOverlay'));
function renderSettings(){
  $('#setMinimap').textContent=state.settings.minimap?'✓ миникарта включена':'миникарта выключена';
  refreshQuota().then(()=>{$('#setStorage').textContent=$('#quotaLine').textContent});
}
$('#setMinimap').onclick=()=>{state.settings.minimap=!state.settings.minimap;
  mm.classList.toggle('hidden',!state.settings.minimap);renderSettings();queueSave();updateMinimap()};

/* ===== клавиатура (для десктопа) ===== */
window.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')){if(e.key==='Escape')e.target.blur();return}
  if(e.key==='Escape'){
    const vw=$('#viewer');
    if(!vw.classList.contains('hidden')){$('#vwClose').click();return}
    const open=[...document.querySelectorAll('.overlay.show')].pop();
    if(open){if(open.id==='edOverlay')saveEditorFields();closeOverlay(open);return}
    setSelected(null);return;
  }
  if(e.code==='Space'){spaceDown=true;return}
  const n=selected?nodeById(selected):null;
  if(e.key==='Tab'){e.preventDefault();openQuickAdd(selected||state.rootId);return}
  if(e.key==='Enter'&&n){e.preventDefault();openQuickAdd(n.parentId||n.id);return}
  if((e.key==='Delete'||e.key==='Backspace')&&n){deleteNode(n.id);return}
  if(e.key===' '&&n){n.collapsed=!n.collapsed;applyNode(n);refresh();queueSave();return}
  if(e.key==='F2'&&n){openEditor(n.id);return}
  const sibs=n?kidsOf(n.parentId):[];const i=sibs.indexOf(n);
  if(e.key==='ArrowLeft'&&n&&n.parentId)focusNode(n.parentId);
  if(e.key==='ArrowRight'&&n&&kidsOf(n.id).length)focusNode(kidsOf(n.id)[0].id);
  if(e.key==='ArrowUp'&&i>0)focusNode(sibs[i-1].id);
  if(e.key==='ArrowDown'&&i>-1&&i<sibs.length-1)focusNode(sibs[i+1].id);
  if(e.key==='+'||e.key==='=')zoomAt(innerWidth/2,innerHeight/2,1.2);
  if(e.key==='-')zoomAt(innerWidth/2,innerHeight/2,0.83);
});
window.addEventListener('keyup',e=>{if(e.code==='Space')spaceDown=false});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>e.preventDefault());
window.addEventListener('resize',applyView);
window.addEventListener('beforeunload',()=>saveBoard());
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveBoard()});
setInterval(()=>saveBoard(),30000);
setTimeout(()=>{$('#boardHint').style.opacity=0},7000);

/* ===== пересборка и старт ===== */
function rebuildAll(){
  world.querySelectorAll('.node').forEach(el=>el.remove());nodeEl.clear();
  selected=null;updateSelbar();
  state.nodes.forEach(makeNodeEl);
  refresh();
}
(async()=>{
  try{
    await openDB();
    const first=await loadOrSeed();
    rebuildAll();
    if(state.nodes.some(n=>n.x===undefined||n.x===null)){
      tidyRadial();
      if(!first)toast('Старые ветки разложены лучами — дальше двигайте как угодно');
    }else applyView();
    if(first){
      await saveBoard();await kvSet('attachments',[]);
      toast('Карта создана. Всё хранится на этом устройстве');
    }
    if(state.settings.minimap)mm.classList.remove('hidden');
  }catch(e){
    document.body.insertAdjacentHTML('beforeend',
      `<div style="position:fixed;inset:0;background:#f3f1ea;display:flex;align-items:center;justify-content:center;padding:24px;font:14px/1.6 Verdana;color:#17313a;z-index:999">Не удалось открыть хранилище браузера.<br>Обновите компонент «Android System WebView».<br><small>${esc(e.message||e)}</small></div>`);
  }
})();
})();
</script>
</body>
