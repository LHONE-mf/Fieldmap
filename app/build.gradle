plugins { id 'com.android.application' }

android {
    namespace 'ru.fieldmap.app'
    compileSdk 35
    defaultConfig {
        applicationId "ru.fieldmap.app"
        minSdk 29          // Android 10+
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// намеренно без зависимостей: приложение полностью автономное
